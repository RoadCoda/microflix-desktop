services:
  - type: web
    name: microflix-studio-collector
    runtime: docker
    branch: microflix-render-collector
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 1c-2g
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /healthz
    disk:
      name: tiktok-browser-profile
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISPLAY
        value: ':99'
      - key: BROWSER_CDP_URL
        value: http://127.0.0.1:9222
      - key: MICROFLIX_WORKER_TOKEN
        sync: false
      - key: VIEWER_PASSWORD
        sync: false
